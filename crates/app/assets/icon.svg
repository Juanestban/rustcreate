<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- rustcreate app icon: a brush head (no handle) leaving a cool-to-warm stroke on a dark disc. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#1c1f33"/>
      <stop offset="0.65" stop-color="#0d0f1a"/>
      <stop offset="1" stop-color="#05060b"/>
    </radialGradient>
    <linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="70" y1="400" x2="400" y2="220">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.25" stop-color="#4f6bff"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="0.68" stop-color="#ec4899"/>
      <stop offset="0.86" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffc53d"/>
    </linearGradient>
    <linearGradient id="tuft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d42"/>
      <stop offset="0.45" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc53d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="239" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <g clip-path="url(#disc)">
    <!-- the stroke: tapered at the start, widest under the brush -->
    <path id="stroke" d="M92 378 C168 302 250 318 318 236 A27 27 0 0 1 356 274 C292 352 190 410 92 378 Z" fill="url(#paint)" filter="url(#glow)" opacity="0.6"/>
    <path d="M92 378 C168 302 250 318 318 236 A27 27 0 0 1 356 274 C292 352 190 410 92 378 Z" fill="url(#paint)"/>
    <!-- bristle streaks -->
    <g fill="none" stroke="#05060b" stroke-linecap="round" stroke-opacity="0.22" stroke-width="3">
      <path d="M126 376 C196 340 270 326 326 250"/>
      <path d="M160 382 C226 358 292 334 338 262"/>
      <path d="M210 370 C266 346 314 318 348 272"/>
    </g>
  </g>

  <!-- brush head, tip resting on the end of the stroke -->
  <g transform="translate(338 254) rotate(45) scale(0.85)">
    <path d="M0 0 C-22 -34 -48 -96 -42 -158 Q0 -176 42 -158 C48 -96 22 -34 0 0 Z" fill="url(#tuft)"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.28" stroke-width="3">
      <path d="M-14 -24 C-28 -70 -30 -112 -26 -150"/>
      <path d="M2 -14 C-2 -60 0 -110 4 -160"/>
      <path d="M18 -34 C26 -80 28 -116 26 -150"/>
    </g>
    <path d="M-42 -158 Q0 -176 42 -158" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>
